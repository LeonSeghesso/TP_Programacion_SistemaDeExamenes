<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis exámenes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="examenes.html">Sistema de Exámenes</a>
            <button id="btnCerrarSesion" class="btn btn-outline-success" type="button">Cerrar sesión</button>
        </div>
    </nav>

    <div class="container mt-5">
        <h4>Mis exámenes</h4>

        <form id="formExamen" class="row g-2 align-items-end mb-4">
            <div class="col-sm-8 col-md-6">
                <label for="nombreExamen" class="form-label">Nuevo examen</label>
                <input type="text" class="form-control" id="nombreExamen" maxlength="100" placeholder="Nombre del examen" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-success">Crear examen</button>
            </div>
        </form>

        <div id="mensaje"></div>
        <div id="listaExamenes" class="list-group mb-5"></div>
    </div>

    <!-- Ventana para editar el nombre de un examen -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formEditar">
                    <div class="modal-header">
                        <h5 class="modal-title">Editar examen</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <label for="nombreEditar" class="form-label">Nombre del examen</label>
                        <input type="text" class="form-control" id="nombreEditar" maxlength="100" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-outline-success">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script src="js/examenes.js"></script>
</body>
</html>
